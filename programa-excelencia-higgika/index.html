<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Enquete Semanal – Higgika</title>
<meta name="description" content="Enquete semanal para colaboradores — Higgika">
<meta name="theme-color" content="#1565C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Enquete Higgika">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<style>
  :root {
    --azul: #1565C0;
    --azul-dark: #0D47A1;
    --verde: #388E3C;
    --amarelo: #F9A825;
    --vermelho: #C62828;
    --bg: #eef3f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg); color: #222; -webkit-tap-highlight-color: transparent;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--azul-dark); color: #fff; padding: 12px 16px;
    position: sticky; top: 0; z-index: 50;
  }
  .header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  .header .sub { font-size: 11px; opacity: .85; }
  .header button {
    background: rgba(255,255,255,.15); color: #fff; border: none; border-radius: 8px;
    padding: 8px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  #responder, #app, #admin-login { max-width: 560px; margin: 0 auto; padding: 16px; padding-bottom: 50px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 14px; font-weight: 700; color: var(--azul-dark); margin: 0 0 12px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; color: #444; margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; background: #fafafa; font-family: inherit;
  }
  .form-group textarea { min-height: 70px; resize: vertical; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--azul); background: #fff; }
  .btn { border: none; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--azul-dark); color: #fff; }
  .btn-primary:hover { background: var(--azul); }
  .btn-secondary { background: #eee; color: #444; }
  .btn-danger { background: var(--vermelho); color: #fff; }
  .btn-whats { background: #25D366; color: #fff; }
  .btn-sm { padding: 6px 10px; font-size: 11px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .empty-state { text-align: center; padding: 32px 16px; color: #aaa; font-size: 13px; }
  .empty-state .icon { font-size: 36px; margin-bottom: 8px; }
  .nota-row { display: flex; gap: 8px; }
  .nota-btn {
    flex: 1; padding: 12px 0; border: 2px solid #ddd; border-radius: 10px; background: #fafafa;
    font-size: 16px; font-weight: 700; color: #555; cursor: pointer;
  }
  .nota-btn.selected { background: var(--azul-dark); border-color: var(--azul-dark); color: #fff; }
  .top-link { text-align: center; font-size: 12px; color: #888; margin-top: 20px; cursor: pointer; text-decoration: underline; }
  .top-link:hover { color: var(--azul-dark); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; }
  .badge-ok { background: #c8e6c9; color: var(--verde); }
  .badge-atencao { background: #ffecb3; color: #a16a00; }
  .badge-alerta { background: #ffcdd2; color: var(--vermelho); }
  .badge-pendente { background: #eee; color: #888; }
  .resp-row { padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .resp-row:last-child { border: none; }
  .link-box {
    display: flex; gap: 8px; align-items: center; background: #eef3f8; border: 1.5px dashed var(--azul);
    border-radius: 8px; padding: 10px; font-size: 12px; word-break: break-all; margin: 10px 0;
  }
  #login-install-btn {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--azul-dark); color: #fff; border: none;
    border-radius: 20px; padding: 8px 16px; font-size: 12px; cursor: pointer; display: none; z-index: 60;
  }
  #config-banner {
    display: none; background: #fff3cd; color: #7a5b00; border: 1px solid #ffe08a;
    border-radius: 10px; padding: 10px 12px; font-size: 11px; margin-bottom: 12px; line-height: 1.5;
  }
</style>
</head>
<body>

<!-- ══════════════ TELA: RESPONDER (pública, sem login) ══════════════ -->
<div id="responder" style="display:none">
  <div class="header"><div><h1>🗳️ Enquete Semanal</h1><div class="sub">Higgika</div></div></div>
  <div id="responder-content" style="padding-top:12px"></div>
  <div class="top-link" onclick="mostrarLoginAdmin()">Sou administrador</div>
  <button id="login-install-btn" onclick="triggerInstall()">📲 Instalar App no celular</button>
</div>

<!-- ══════════════ TELA: LOGIN DO ADMINISTRADOR ══════════════ -->
<div id="admin-login" style="display:none">
  <div class="header"><div><h1>🗳️ Enquete Semanal</h1><div class="sub">Área do administrador</div></div></div>
  <div class="card" style="margin-top:12px">
    <h2>🔐 Entrar</h2>
    <div class="form-group"><label>E-mail</label>
      <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="username"></div>
    <div class="form-group"><label>Senha</label>
      <input type="password" id="login-password" placeholder="Senha" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') doEmailLogin()"></div>
    <button class="btn btn-primary" style="width:100%" onclick="doEmailLogin()">Entrar</button>
    <div id="login-error" style="color:#c62828;font-size:12px;margin-top:10px;min-height:14px"></div>
  </div>
  <div class="top-link" onclick="voltarParaResponder()">← Voltar para a enquete</div>
</div>

<!-- ══════════════ APP ADMIN ══════════════ -->
<div id="app" style="display:none">
  <div class="header">
    <div><h1>🗳️ Enquete Semanal</h1><div class="sub">Higgika — Administrador</div></div>
    <button onclick="logout()">Sair</button>
  </div>
  <div id="admin-content" style="padding:16px"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// ═══════════════════════════════════════════════
//  CONFIGURAÇÃO DO FIREBASE — banco de dados PRÓPRIO deste app.
//  Veja README.md para o passo a passo de criação e as regras do Firestore.
// ═══════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBkN3NjY4Zadz6y0fza4do74cctVY7lnWw",
  authDomain: "enquete---natury-paper.firebaseapp.com",
  projectId: "enquete---natury-paper",
  storageBucket: "enquete---natury-paper.firebasestorage.app",
  messagingSenderId: "697437985440",
  appId: "1:697437985440:web:b796bd1eceb05b54ad87c5",
};
const FIREBASE_CONFIGURADO = FIREBASE_CONFIG.projectId && !FIREBASE_CONFIG.projectId.startsWith('COLE_AQUI');

let db = null; // null = modo local, salvando só neste aparelho (sem Firebase configurado)

async function initFirebase() {
  if (!FIREBASE_CONFIGURADO) return false;
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    firebase.auth();
    return true;
  } catch (e) {
    console.error('Erro ao inicializar Firebase:', e);
    db = null;
    return false;
  }
}

// ═══════════════════════════════════════════════
//  DADOS
// ═══════════════════════════════════════════════
let enqColaboradores = [];   // {id, nome}
let enqConfig = {
  perguntas: [
    { id:'p1', tipo:'nota',  texto:'De 1 a 5, como foi sua semana de trabalho?' },
    { id:'p2', tipo:'nota',  texto:'De 1 a 5, como está seu relacionamento com a equipe esta semana?' },
    { id:'p3', tipo:'texto', texto:'Quer compartilhar alguma dificuldade, sugestão ou elogio?' },
    { id:'p4', tipo:'texto', texto:'Precisa de ajuda com algo específico esta semana?' },
  ],
  notaAlerta: 3, // nota igual ou menor que isso entra em alerta
  palavrasAlerta: ['briga','brigando','conflito','estresse','estressado','ansioso','ansiedade','triste',
    'deprimido','desmotivado','não aguento','demitir','demissão','assédio','agressão','humilhação','injusto','injustiça','sozinho'],
};
let enqRodadas = [];    // {id, criadoEm, data, perguntas:[...], ativa}
let enqRespostas = [];  // {id, rodadaId, colaboradorId, colaboradorNome, respostas:{perguntaId:valor}, enviadoEm}

function enqHojeISO() { return new Date().toISOString().slice(0,10); }
function enqGerarId(prefixo) { return prefixo + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

// ═══════════════════════════════════════════════
//  PERSISTÊNCIA
// ═══════════════════════════════════════════════
function saveLocal() {
  localStorage.setItem('enq_colaboradores', JSON.stringify(enqColaboradores));
  localStorage.setItem('enq_config',        JSON.stringify(enqConfig));
  localStorage.setItem('enq_rodadas',       JSON.stringify(enqRodadas));
  localStorage.setItem('enq_respostas',     JSON.stringify(enqRespostas));
}
function loadLocal() {
  enqColaboradores = JSON.parse(localStorage.getItem('enq_colaboradores') || '[]');
  enqConfig         = JSON.parse(localStorage.getItem('enq_config')        || 'null') || enqConfig;
  enqRodadas        = JSON.parse(localStorage.getItem('enq_rodadas')       || '[]');
  enqRespostas      = JSON.parse(localStorage.getItem('enq_respostas')     || '[]');
}

function enqPersistir(acaoRemota) {
  if (db) acaoRemota(); else saveLocal();
}
function enqSaveDoc(colecao, obj) {
  const { id, ...data } = obj;
  db.collection(colecao).doc(id).set(data).catch(e => { console.error(e); alert('Erro ao salvar: ' + e.message); });
}
function enqDeleteDoc(colecao, id) {
  db.collection(colecao).doc(id).delete().catch(e => { console.error(e); alert('Erro ao excluir: ' + e.message); });
}
function enqSaveConfig() {
  db.collection('enquete_config').doc('main').set(enqConfig).catch(e => { console.error(e); alert('Erro ao salvar: ' + e.message); });
}

// Listeners em tempo real — desligados a cada logout/login para não acumular.
let _enqUnsubs = [];
function enqTeardown() {
  _enqUnsubs.forEach(u => { try { u(); } catch(e){} });
  _enqUnsubs = [];
}
function enqSubscribe(ref, onData) {
  return new Promise((resolve, reject) => {
    let primeira = true;
    const unsub = ref.onSnapshot(
      snap => {
        onData(snap);
        if (primeira) { primeira = false; resolve(); }
        else {
          if (document.getElementById('app').style.display !== 'none') renderAdmin();
          if (document.getElementById('responder').style.display !== 'none') renderResponder();
        }
      },
      err => { if (primeira) { primeira = false; reject(err); } else console.error(err); }
    );
    _enqUnsubs.push(unsub);
  });
}

async function carregarPublico() {
  // enquete_config e enquete_rodadas são de leitura pública (sem dado sensível).
  // enquete_colaboradores agora guarda a senha de cada um, então a leitura exige
  // ao menos uma sessão anônima (estabelecida sozinha, sem o colaborador perceber).
  enqTeardown();
  const tasks = [];
  tasks.push(enqSubscribe(db.collection('enquete_colaboradores'), snap => {
    enqColaboradores = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }));
  tasks.push(enqSubscribe(db.collection('enquete_config').doc('main'), snap => {
    if (snap.exists) enqConfig = { ...enqConfig, ...snap.data() };
  }));
  tasks.push(enqSubscribe(db.collection('enquete_rodadas'), snap => {
    enqRodadas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }));
  await Promise.all(tasks);
}

async function carregarAdmin() {
  enqTeardown();
  const tasks = [];
  tasks.push(enqSubscribe(db.collection('enquete_colaboradores'), snap => {
    enqColaboradores = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }));
  tasks.push(enqSubscribe(db.collection('enquete_config').doc('main'), snap => {
    if (snap.exists) enqConfig = { ...enqConfig, ...snap.data() };
  }));
  tasks.push(enqSubscribe(db.collection('enquete_rodadas'), snap => {
    enqRodadas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }));
  tasks.push(enqSubscribe(db.collection('enquete_respostas'), snap => {
    enqRespostas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }));
  await Promise.all(tasks);
}

// ═══════════════════════════════════════════════
//  LOGIN DO ADMINISTRADOR (e-mail/senha reais)
// ═══════════════════════════════════════════════
function mostrarLoginAdmin() {
  if (!db) {
    // Modo local de teste (sem Firebase configurado): não há nada a proteger
    // num único aparelho, então entra direto no painel do administrador.
    document.getElementById('responder').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderAdmin();
    return;
  }
  document.getElementById('responder').style.display = 'none';
  document.getElementById('admin-login').style.display = 'block';
}
function voltarParaResponder() {
  document.getElementById('admin-login').style.display = 'none';
  document.getElementById('responder').style.display = 'block';
}

async function doEmailLogin() {
  const email = (document.getElementById('login-email').value||'').trim();
  const senha = document.getElementById('login-password').value||'';
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !senha) { errEl.textContent = 'Informe e-mail e senha.'; return; }
  try {
    await firebase.auth().signInWithEmailAndPassword(email, senha);
  } catch (e) {
    errEl.textContent = 'E-mail ou senha incorretos.';
  }
}

async function entrarComoAdmin(user) {
  const errEl = document.getElementById('login-error');
  const roleDoc = await db.collection('enquete_roles').doc(user.uid).get();
  if (!roleDoc.exists || roleDoc.data().role !== 'admin') {
    if (errEl) errEl.textContent = 'Esta conta não tem acesso de administrador.';
    await firebase.auth().signOut();
    return;
  }
  await carregarAdmin();
  document.getElementById('responder').style.display = 'none';
  document.getElementById('admin-login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderAdmin();
}

async function logout() {
  if (!confirm('Sair da área de administrador?')) return;
  if (db) {
    enqTeardown();
    await firebase.auth().signOut();
    // Restabelece a sessão anônima, necessária para a tela pública ler a
    // lista de colaboradores (que agora guarda as senhas).
    try { await firebase.auth().signInAnonymously(); } catch (e) { console.error(e); }
    await carregarPublico();
  }
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-email').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').textContent = '';
  _enqColaboradorRespId = null;
  iniciarTelaResponder();
}

// ═══════════════════════════════════════════════
//  RESPOSTA (colaborador — identifica-se com nome + senha de 4 dígitos)
// ═══════════════════════════════════════════════
function enqRodadaAlvo() {
  const params = new URLSearchParams(location.search);
  const r = params.get('r');
  if (r) return enqRodadas.find(x => x.id === r) || null;
  const ativas = enqRodadas.filter(x => x.ativa).sort((a,b) => (b.criadoEm||'').localeCompare(a.criadoEm||''));
  return ativas[0] || null;
}

function enqJaRespondeu(rodadaId, colaboradorId) {
  return localStorage.getItem('enq_respondido_' + rodadaId + '_' + colaboradorId);
}

let _enqColaboradorRespId = null;

function renderResponder() {
  const el = document.getElementById('responder-content');
  if (!el) return;
  if (!enqColaboradores.length) {
    el.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">🗳️</div>Nenhuma enquete disponível no momento.</div></div>';
    return;
  }
  const rodada = enqRodadaAlvo();
  if (!rodada) {
    el.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">🗳️</div>Nenhuma enquete ativa no momento. Peça o link correto ao administrador.</div></div>';
    return;
  }
  if (!_enqColaboradorRespId) { renderLoginColaborador(el, rodada); return; }
  const colaborador = enqColaboradores.find(c => c.id === _enqColaboradorRespId);
  if (!colaborador) { _enqColaboradorRespId = null; renderLoginColaborador(el, rodada); return; }

  if (colaborador.pinAlterado === false) { renderTrocarSenha(el, colaborador); return; }

  if (enqJaRespondeu(rodada.id, colaborador.id)) {
    el.innerHTML = `<div class="card"><div class="empty-state"><div class="icon">✅</div>${colaborador.nome}, você já respondeu esta enquete. Obrigado!</div></div>
      <div class="top-link" onclick="_enqColaboradorRespId=null;renderResponder()">Trocar de usuário</div>`;
    return;
  }
  renderFormularioPerguntas(el, rodada, colaborador);
}

function renderLoginColaborador(el, rodada) {
  const setores = [...new Set(enqColaboradores.map(c => c.setor || 'Geral'))];
  const optgroups = setores.map(setor => {
    const opts = enqColaboradores.filter(c => (c.setor||'Geral') === setor)
      .map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
    return `<optgroup label="${setor}">${opts}</optgroup>`;
  }).join('');
  el.innerHTML = `
  <div class="card">
    <h2>📅 Enquete de ${rodada.data.split('-').reverse().join('/')}</h2>
    <div class="form-group"><label>Quem é você?</label>
      <select id="login-colab-select"><option value="">— Selecione —</option>${optgroups}</select></div>
    <div class="form-group"><label>Sua senha (4 dígitos)</label>
      <input type="tel" inputmode="numeric" maxlength="4" id="login-colab-pin" placeholder="••••"
        onkeydown="if(event.key==='Enter') enqLoginColaborador()"></div>
    <button class="btn btn-primary" style="width:100%" onclick="enqLoginColaborador()">Entrar</button>
    <div id="login-colab-msg" style="font-size:12px;margin-top:8px;color:#c62828"></div>
  </div>`;
}

function enqLoginColaborador() {
  const id = document.getElementById('login-colab-select').value;
  const pin = (document.getElementById('login-colab-pin').value||'').trim();
  const msg = document.getElementById('login-colab-msg');
  if (!id) { msg.textContent = 'Selecione quem você é.'; return; }
  const colaborador = enqColaboradores.find(c => c.id === id);
  if (!colaborador || pin !== String(colaborador.pin||'')) { msg.textContent = 'Senha incorreta. Tente novamente.'; return; }
  _enqColaboradorRespId = id;
  renderResponder();
}

function renderTrocarSenha(el, colaborador) {
  el.innerHTML = `
  <div class="card">
    <h2>🔐 Defina sua nova senha</h2>
    <div style="font-size:12px;color:#666;margin-bottom:10px">É seu primeiro acesso, ${colaborador.nome}. Crie uma senha de 4 dígitos só sua, trocando a senha que o administrador te deu.</div>
    <div class="form-group"><label>Nova senha (4 dígitos)</label>
      <input type="tel" inputmode="numeric" maxlength="4" id="nova-senha-1"></div>
    <div class="form-group"><label>Confirme a nova senha</label>
      <input type="tel" inputmode="numeric" maxlength="4" id="nova-senha-2"></div>
    <button class="btn btn-primary" style="width:100%" onclick="enqDefinirNovaSenha('${colaborador.id}')">Salvar e continuar</button>
    <div id="nova-senha-msg" style="font-size:12px;margin-top:8px;color:#c62828"></div>
  </div>`;
}

function enqDefinirNovaSenha(colaboradorId) {
  const s1 = (document.getElementById('nova-senha-1').value||'').trim();
  const s2 = (document.getElementById('nova-senha-2').value||'').trim();
  const msg = document.getElementById('nova-senha-msg');
  if (!/^\d{4}$/.test(s1)) { msg.textContent = 'A senha deve ter exatamente 4 números.'; return; }
  if (s1 !== s2) { msg.textContent = 'As senhas não coincidem.'; return; }
  const colaborador = enqColaboradores.find(c => c.id === colaboradorId);
  if (!colaborador) return;
  colaborador.pin = s1;
  colaborador.pinAlterado = true;
  enqPersistir(() => enqSaveDoc('enquete_colaboradores', colaborador));
  renderResponder();
}

function renderFormularioPerguntas(el, rodada, colaborador) {
  const perguntasHtml = rodada.perguntas.map(p => {
    if (p.tipo === 'nota') {
      return `<div class="form-group"><label>${p.texto}</label>
        <div class="nota-row" id="nota-row-${p.id}">
          ${[1,2,3,4,5].map(n => `<button type="button" class="nota-btn" onclick="enqSelecionarNota('${p.id}',${n})">${n}</button>`).join('')}
        </div></div>`;
    }
    return `<div class="form-group"><label>${p.texto}</label><textarea id="resp-${p.id}" placeholder="Escreva aqui (opcional)"></textarea></div>`;
  }).join('');

  el.innerHTML = `
  <div class="card">
    <h2>📅 Enquete de ${rodada.data.split('-').reverse().join('/')}</h2>
    <div style="font-size:12px;color:#666;margin-bottom:10px">Respondendo como <strong>${colaborador.nome}</strong> · <span class="top-link" style="display:inline" onclick="_enqColaboradorRespId=null;renderResponder()">trocar</span></div>
    ${perguntasHtml}
    <button class="btn btn-primary" style="width:100%" onclick="enqEnviarResposta('${rodada.id}')">Enviar resposta</button>
    <div id="resp-msg" style="font-size:12px;margin-top:8px;color:#c62828"></div>
  </div>`;
}

let _enqNotasSelecionadas = {};
function enqSelecionarNota(perguntaId, nota) {
  _enqNotasSelecionadas[perguntaId] = nota;
  document.querySelectorAll(`#nota-row-${perguntaId} .nota-btn`).forEach((btn,i) => {
    btn.classList.toggle('selected', i+1 === nota);
  });
}

async function enqEnviarResposta(rodadaId) {
  const msg = document.getElementById('resp-msg');
  const colaboradorId = _enqColaboradorRespId;
  const colaborador = enqColaboradores.find(c => c.id === colaboradorId);
  if (!colaborador) { msg.textContent = 'Sessão expirada, selecione seu nome novamente.'; _enqColaboradorRespId = null; renderResponder(); return; }
  const rodada = enqRodadas.find(r => r.id === rodadaId);
  if (!rodada) { msg.textContent = 'Esta enquete não está mais disponível.'; return; }
  const respostas = {};
  for (const p of rodada.perguntas) {
    if (p.tipo === 'nota') {
      if (!_enqNotasSelecionadas[p.id]) { msg.textContent = 'Responda a pergunta: "' + p.texto + '"'; return; }
      respostas[p.id] = _enqNotasSelecionadas[p.id];
    } else {
      respostas[p.id] = (document.getElementById('resp-' + p.id).value||'').trim();
    }
  }
  const entry = {
    id: rodadaId + '_' + colaboradorId,
    rodadaId, colaboradorId, colaboradorNome: colaborador.nome,
    respostas, enviadoEm: new Date().toISOString(),
  };
  msg.style.color = '#666'; msg.textContent = 'Enviando...';
  try {
    if (db) {
      if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
      enqSaveDoc('enquete_respostas', entry);
    } else {
      enqRespostas.push(entry);
      saveLocal();
    }
    localStorage.setItem('enq_respondido_' + rodadaId + '_' + colaboradorId, '1');
    _enqNotasSelecionadas = {};
    renderResponder();
  } catch (e) {
    msg.style.color = '#c62828'; msg.textContent = 'Erro ao enviar: ' + e.message;
  }
}

// ═══════════════════════════════════════════════
//  ADMIN — colaboradores, perguntas, alertas, rodadas
// ═══════════════════════════════════════════════
function enqGerarPin(pinsExistentes) {
  let pin;
  do { pin = String(Math.floor(1000 + Math.random()*9000)); } while (pinsExistentes.has(pin));
  return pin;
}

function enqAddColaborador() {
  const nome = (document.getElementById('enq-new-colab').value||'').trim().toUpperCase();
  const setor = (document.getElementById('enq-new-colab-setor').value||'').trim() || 'Geral';
  if (!nome) return;
  if (enqColaboradores.find(c => c.nome === nome)) { alert('Colaborador já cadastrado.'); return; }
  const pinsExistentes = new Set(enqColaboradores.map(c => c.pin).filter(Boolean));
  const pin = enqGerarPin(pinsExistentes);
  const novo = { id: enqGerarId('col'), nome, setor, pin, pinAlterado: false };
  enqColaboradores.push(novo);
  document.getElementById('enq-new-colab').value = '';
  enqPersistir(() => enqSaveDoc('enquete_colaboradores', novo));
  alert(`✅ Colaborador cadastrado!\n\nSenha inicial de ${nome}: ${pin}\n(ele(a) deve trocar no primeiro acesso)`);
  renderAdmin();
}
function enqRemoveColaborador(id) {
  if (!confirm('Remover este colaborador da lista? O histórico de respostas é mantido.')) return;
  enqColaboradores = enqColaboradores.filter(c => c.id !== id);
  enqPersistir(() => enqDeleteDoc('enquete_colaboradores', id));
  renderAdmin();
}
function enqResetarSenha(id) {
  const c = enqColaboradores.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`Gerar uma nova senha temporária para ${c.nome}? Ele(a) vai precisar trocar no próximo acesso.`)) return;
  const pinsExistentes = new Set(enqColaboradores.filter(x => x.id !== id).map(x => x.pin).filter(Boolean));
  c.pin = enqGerarPin(pinsExistentes);
  c.pinAlterado = false;
  enqPersistir(() => enqSaveDoc('enquete_colaboradores', c));
  alert(`✅ Nova senha de ${c.nome}: ${c.pin}\n\nRepasse individualmente — ele(a) vai precisar trocar no próximo acesso.`);
  renderAdmin();
}

let _enqUltimaImportacao = null;
function enqImportarColaboradores() {
  const texto = document.getElementById('enq-import-lista').value || '';
  const blocos = texto.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const pinsExistentes = new Set(enqColaboradores.map(c => c.pin).filter(Boolean));
  const novos = [];
  blocos.forEach(bloco => {
    const linhas = bloco.split('\n').map(l => l.trim()).filter(Boolean);
    if (!linhas.length) return;
    const setor = linhas[0];
    linhas.slice(1).forEach(nomeRaw => {
      const nome = nomeRaw.toUpperCase();
      if (enqColaboradores.find(c => c.nome === nome) || novos.find(n => n.nome === nome)) return;
      const pin = enqGerarPin(pinsExistentes);
      pinsExistentes.add(pin);
      novos.push({ id: enqGerarId('col'), nome, setor, pin, pinAlterado: false });
    });
  });
  if (!novos.length) { alert('Nenhum colaborador novo encontrado no texto colado (ou todos já cadastrados).'); return; }
  novos.forEach(n => { enqColaboradores.push(n); enqPersistir(() => enqSaveDoc('enquete_colaboradores', n)); });
  document.getElementById('enq-import-lista').value = '';
  _enqUltimaImportacao = novos;
  renderAdmin();
}
function enqTextoImportacao() {
  return _enqUltimaImportacao.map(c => `${c.nome} (${c.setor}): ${c.pin}`).join('\n');
}
function enqCopiarImportacao() {
  const texto = enqTextoImportacao();
  navigator.clipboard.writeText(texto).then(() => alert('Lista copiada!'), () => prompt('Copie a lista:', texto));
}
function enqFecharImportacao() { _enqUltimaImportacao = null; renderAdmin(); }

function enqAddPergunta() {
  const texto = (document.getElementById('enq-new-pergunta').value||'').trim();
  const tipo = document.getElementById('enq-new-pergunta-tipo').value;
  if (!texto) return;
  enqConfig.perguntas.push({ id: enqGerarId('p'), tipo, texto });
  document.getElementById('enq-new-pergunta').value = '';
  enqPersistir(enqSaveConfig);
  renderAdmin();
}
function enqRemovePergunta(id) {
  if (!confirm('Remover esta pergunta do questionário padrão? Rodadas já geradas não são afetadas.')) return;
  enqConfig.perguntas = enqConfig.perguntas.filter(p => p.id !== id);
  enqPersistir(enqSaveConfig);
  renderAdmin();
}
function enqSalvarAlertas() {
  enqConfig.notaAlerta = Number(document.getElementById('enq-nota-alerta').value || 3);
  enqConfig.palavrasAlerta = (document.getElementById('enq-palavras-alerta').value || '')
    .split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
  enqPersistir(enqSaveConfig);
  alert('✅ Configurações de alerta salvas.');
  renderAdmin();
}

function enqGerarRodada() {
  if (!enqConfig.perguntas.length) { alert('Cadastre pelo menos uma pergunta antes de gerar a enquete.'); return; }
  enqRodadas.forEach(r => { if (r.ativa) { r.ativa = false; enqPersistir(() => enqSaveDoc('enquete_rodadas', r)); } });
  const nova = {
    id: enqGerarId('rodada'),
    criadoEm: new Date().toISOString(),
    data: enqHojeISO(),
    perguntas: enqConfig.perguntas.map(p => ({ ...p })),
    ativa: true,
  };
  enqRodadas.push(nova);
  enqPersistir(() => enqSaveDoc('enquete_rodadas', nova));
  _enqRodadaSelecionada = nova.id;
  renderAdmin();
}

function enqLinkRodada(id) {
  return location.origin + location.pathname + '?r=' + id;
}
function enqCopiarLink(id) {
  const link = enqLinkRodada(id);
  navigator.clipboard.writeText(link).then(
    () => alert('🔗 Link copiado!\n\n' + link),
    () => prompt('Copie o link abaixo:', link)
  );
}
function enqCompartilharWhatsApp(id) {
  const link = enqLinkRodada(id);
  const texto = `🗳️ Enquete semanal Higgika\n\nResponda rapidinho, leva 1 minuto:\n${link}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
}

// ═══════════════════════════════════════════════
//  ADMIN — dashboard de respostas com sinais de alerta
// ═══════════════════════════════════════════════
function enqCorNota(nota) {
  if (nota >= 4) return { cls: 'badge-ok', label: nota + '/5' };
  if (nota === enqConfig.notaAlerta) return { cls: 'badge-atencao', label: nota + '/5' };
  if (nota <= enqConfig.notaAlerta) return { cls: 'badge-alerta', label: nota + '/5 ⚠️' };
  return { cls: 'badge-atencao', label: nota + '/5' };
}
function enqDestacarTexto(texto) {
  if (!texto) return '<span style="color:#aaa">— sem resposta —</span>';
  let out = texto;
  let temAlerta = false;
  enqConfig.palavrasAlerta.forEach(palavra => {
    if (!palavra) return;
    const re = new RegExp('(' + palavra.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    if (re.test(out)) { temAlerta = true; out = out.replace(re, '<strong style="color:#c62828;background:#ffebee;padding:0 2px;border-radius:3px">$1</strong>'); }
  });
  return (temAlerta ? '⚠️ ' : '') + out;
}

function enqHistoricoMedia(colaboradorId) {
  const rodadasOrdenadas = [...enqRodadas].sort((a,b) => (a.criadoEm||'').localeCompare(b.criadoEm||'')).slice(-6);
  return rodadasOrdenadas.map(r => {
    const resp = enqRespostas.find(x => x.rodadaId === r.id && x.colaboradorId === colaboradorId);
    if (!resp) return null;
    const notas = r.perguntas.filter(p => p.tipo === 'nota').map(p => Number(resp.respostas[p.id] || 0)).filter(Boolean);
    if (!notas.length) return null;
    return (notas.reduce((s,n) => s+n, 0) / notas.length).toFixed(1);
  }).filter(Boolean);
}

let _enqRodadaSelecionada = null;
function renderPainelRespostas() {
  if (!enqRodadas.length) return '<div class="empty-state"><div class="icon">🗳️</div>Nenhuma enquete gerada ainda.</div>';
  const rodadasOrdenadas = [...enqRodadas].sort((a,b) => (b.criadoEm||'').localeCompare(a.criadoEm||''));
  if (!_enqRodadaSelecionada || !enqRodadas.find(r => r.id === _enqRodadaSelecionada)) {
    _enqRodadaSelecionada = rodadasOrdenadas[0].id;
  }
  const rodada = enqRodadas.find(r => r.id === _enqRodadaSelecionada);
  const options = rodadasOrdenadas.map(r =>
    `<option value="${r.id}" ${r.id===_enqRodadaSelecionada?'selected':''}>${r.data.split('-').reverse().join('/')}${r.ativa?' (ativa)':''}</option>`).join('');

  const linhas = enqColaboradores.map(c => {
    const resp = enqRespostas.find(x => x.rodadaId === rodada.id && x.colaboradorId === c.id);
    const historico = enqHistoricoMedia(c.id);
    const tendencia = historico.length ? `<div style="font-size:11px;color:#888;margin-top:4px">📈 Últimas médias: ${historico.join(', ')}</div>` : '';
    if (!resp) {
      return `<div class="resp-row"><strong>${c.nome}</strong> <span class="badge badge-pendente">não respondeu</span>${tendencia}</div>`;
    }
    const partes = rodada.perguntas.map(p => {
      if (p.tipo === 'nota') {
        const nota = Number(resp.respostas[p.id] || 0);
        const cor = enqCorNota(nota);
        return `<div style="margin-top:6px"><span class="badge ${cor.cls}">${cor.label}</span> <span style="font-size:11px;color:#777">${p.texto}</span></div>`;
      }
      return `<div style="margin-top:6px;font-size:12px"><span style="font-size:11px;color:#777">${p.texto}</span><br>${enqDestacarTexto(resp.respostas[p.id])}</div>`;
    }).join('');
    return `<div class="resp-row"><strong>${c.nome}</strong> <span class="badge badge-ok">respondeu</span>${partes}${tendencia}</div>`;
  }).join('');

  return `
    <div class="form-group"><label>Enquete (semana)</label>
      <select id="enq-sel-rodada" onchange="_enqRodadaSelecionada=this.value;renderAdmin()">${options}</select></div>
    <div class="link-box">🔗 ${enqLinkRodada(rodada.id)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <button class="btn btn-secondary btn-sm" onclick="enqCopiarLink('${rodada.id}')">📋 Copiar link</button>
      <button class="btn btn-whats btn-sm" onclick="enqCompartilharWhatsApp('${rodada.id}')">📤 Compartilhar no WhatsApp</button>
    </div>
    ${linhas || '<div class="empty-state">Nenhum colaborador cadastrado.</div>'}`;
}

function renderAdmin() {
  const el = document.getElementById('admin-content');
  if (!el) return;
  const banner = FIREBASE_CONFIGURADO ? '' :
    `<div id="config-banner" style="display:block">⚠️ Este app ainda está salvando os dados só neste aparelho (Firebase não configurado). Veja o <strong>README.md</strong> para conectar um banco próprio e sincronizar entre celulares.</div>`;

  const colabList = (() => {
    if (!enqColaboradores.length) return '<div style="font-size:12px;color:#aaa;text-align:center;padding:8px">Nenhum colaborador cadastrado.</div>';
    const setores = [...new Set(enqColaboradores.map(c => c.setor || 'Geral'))];
    return setores.map(setor => {
      const itens = enqColaboradores.filter(c => (c.setor||'Geral') === setor).map(c => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-bottom:1px solid #f5f5f5;font-size:13px">
          <span>${c.nome} ${c.pinAlterado===false ? '<span class="badge badge-atencao" style="margin-left:4px">senha padrão</span>' : ''}</span>
          <div style="display:flex;gap:6px">
            <button class="btn btn-secondary btn-sm" onclick="enqResetarSenha('${c.id}')">🔑</button>
            <button class="btn btn-danger btn-sm" onclick="enqRemoveColaborador('${c.id}')">✕</button>
          </div>
        </div>`).join('');
      return `<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:var(--azul-dark);text-transform:uppercase;margin-bottom:4px">${setor}</div>${itens}</div>`;
    }).join('');
  })();

  const importacaoCard = _enqUltimaImportacao ? `
  <div class="card" style="border:2px solid var(--amarelo)">
    <h2>🔑 Senhas geradas (${_enqUltimaImportacao.length} colaboradores novos)</h2>
    <div style="font-size:11px;color:#888;margin-bottom:8px">Repasse cada senha individualmente (WhatsApp direto, não no grupo). Cada um precisa trocar a senha no primeiro acesso.</div>
    <pre style="background:#f5f5f5;padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;margin:0">${enqTextoImportacao()}</pre>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-secondary btn-sm" onclick="enqCopiarImportacao()">📋 Copiar lista</button>
      <button class="btn btn-secondary btn-sm" onclick="enqFecharImportacao()">Fechar</button>
    </div>
  </div>` : '';

  const perguntasList = enqConfig.perguntas.map(p => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-bottom:1px solid #f5f5f5;font-size:13px">
      <span>${p.tipo === 'nota' ? '🔢' : '✏️'} ${p.texto}</span>
      <button class="btn btn-danger btn-sm" onclick="enqRemovePergunta('${p.id}')">✕</button>
    </div>`).join('') || '<div style="font-size:12px;color:#aaa;text-align:center;padding:8px">Nenhuma pergunta cadastrada.</div>';

  el.innerHTML = `${banner}${importacaoCard}
  <div class="card">
    <h2>🔗 Enquete da semana</h2>
    <button class="btn btn-primary" style="width:100%" onclick="enqGerarRodada()">➕ Gerar nova enquete (nova semana)</button>
    <div style="font-size:11px;color:#888;margin-top:8px">Isso cria um link novo com as perguntas atuais e desativa o anterior. Cole o link no grupo do WhatsApp.</div>
  </div>

  <div class="card">
    <h2>📊 Respostas e sinais de alerta</h2>
    ${renderPainelRespostas()}
  </div>

  <div class="card">
    <h2>👥 Colaboradores</h2>
    ${colabList}
    <div style="display:flex;gap:8px;margin-top:10px">
      <input type="text" id="enq-new-colab" placeholder="Nome do colaborador" style="flex:1;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-size:13px">
      <input type="text" id="enq-new-colab-setor" placeholder="Setor" style="flex:0 0 110px;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-size:13px">
      <button class="btn btn-primary" onclick="enqAddColaborador()">➕</button>
    </div>
  </div>

  <div class="card">
    <h2>📥 Importar lista de colaboradores</h2>
    <div style="font-size:11px;color:#888;margin-bottom:8px">Cole uma lista no formato abaixo (nome do setor numa linha, colaboradores daquele setor nas linhas seguintes, um setor separado do outro por linha em branco). Uma senha de 4 dígitos é gerada automaticamente para cada nome novo.</div>
    <div class="form-group"><textarea id="enq-import-lista" style="min-height:220px;font-family:monospace;font-size:12px">Produção
Éder
Reginaldo
Wilian
Sérgio

Logística

Motoristas

Administrativo

Limpeza
Ingredi</textarea></div>
    <button class="btn btn-primary" onclick="enqImportarColaboradores()">📥 Importar lista</button>
  </div>

  <div class="card">
    <h2>❓ Perguntas padrão da enquete</h2>
    ${perguntasList}
    <div class="form-group" style="margin-top:10px"><label>Nova pergunta</label>
      <div style="display:flex;gap:8px">
        <select id="enq-new-pergunta-tipo" style="flex:0 0 110px">
          <option value="nota">Nota 1-5</option>
          <option value="texto">Texto livre</option>
        </select>
        <input type="text" id="enq-new-pergunta" placeholder="Digite a pergunta">
      </div>
    </div>
    <button class="btn btn-primary" onclick="enqAddPergunta()">➕ Adicionar pergunta</button>
  </div>

  <div class="card">
    <h2>⚠️ Configurar alertas automáticos</h2>
    <div class="form-group"><label>Nota considerada "atenção" (1-5)</label>
      <input type="number" id="enq-nota-alerta" min="1" max="5" value="${enqConfig.notaAlerta}"></div>
    <div class="form-group"><label>Palavras que disparam alerta nas respostas de texto (separadas por vírgula)</label>
      <textarea id="enq-palavras-alerta">${enqConfig.palavrasAlerta.join(', ')}</textarea></div>
    <button class="btn btn-primary" onclick="enqSalvarAlertas()">Salvar configurações</button>
    <div style="font-size:11px;color:#888;margin-top:8px">Isso é um alerta simples por palavra-chave e nota baixa — não é uma análise de sentimento real. Use como apoio, não como veredito.</div>
  </div>`;
}

// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════
let _pwaPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  _pwaPrompt = e;
  const btn = document.getElementById('login-install-btn');
  if (btn) btn.style.display = 'inline-block';
});
function triggerInstall() {
  if (!_pwaPrompt) return;
  _pwaPrompt.prompt();
  _pwaPrompt = null;
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
}

// ═══════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════
function iniciarTelaResponder() {
  document.getElementById('admin-login').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  document.getElementById('responder').style.display = 'block';
  renderResponder();
}

async function startApp() {
  const ok = await initFirebase();
  if (!ok || !db) {
    loadLocal();
    iniciarTelaResponder();
    return;
  }
  await carregarPublico();
  iniciarTelaResponder();
  firebase.auth().onAuthStateChanged(async (user) => {
    if (!user || user.isAnonymous) return;
    try {
      await entrarComoAdmin(user);
    } catch (e) {
      console.error(e);
      const errEl = document.getElementById('login-error');
      if (errEl) errEl.textContent = 'Erro ao carregar dados: ' + e.message;
      firebase.auth().signOut();
    }
  });
}

startApp();
